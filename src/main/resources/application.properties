spring.application.name=TrainSync

# Database Config - use Railway environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase Config - use environment variables too
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.bucket.name=${SUPABASE_BUCKET_NAME}

# Default Login for Testing
default.email=${DEFAULT_EMAIL:sajal147x@gmail.com}
default.password=${DEFAULT_PASSWORD:test123}